name: jolshiri_smart_city
description: "Jolshiri Smart City Mobile Application - Flutter Frontend"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.2.3
  google_sign_in: ^6.2.1
  http: ^1.2.2
  http_parser: ^4.0.2
  url_launcher: ^6.3.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.0.0
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/listings/
